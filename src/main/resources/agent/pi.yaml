# Pi, a provider-agnostic coding agent.
#
# The second agent, and deliberately the awkward one: it is not tied to a provider, it cannot be
# pointed at a broker with an environment variable, and it is a tree of files rather than one
# binary. Each of those exercises something the first agent never touched.

name: pi
label: Pi
binary: pi

# Where this agent keeps its own credentials, for 'porelo vault import' and for what it finds of itself on
# the host: auth.json there, read in Pi 1.4.0's package. Its wrapper in the image moves it for a task, which
# is not this directory: this one is read on the host.
config_dir: "~/.pi/agent"

# Pi asks no permission questions: its shipped docs open "Pi runs with all permissions by
# default", and 'pi --help' has no approval flag - measured on 0.85.0. 1.3.0's docs say it "does not
# ask for approval before every tool call", read in its package. Its one question inside a task is
# whether to trust a workspace carrying .pi or .agents/skills.
#
# --no-approve answers it by ignoring those files, and that is a choice, not a default: trusting
# them would load the repository's own extensions after porelo-route.ts, where one could re-register
# the provider Porelo routed. The cost is that a repository's own Pi extensions do not load.
#
# --no-skills: measured on 1.4.0, --no-approve leaves the skills in Pi's own directory listed, and with
# this none is. A soft bound: the agent can still read such a file, and start another Pi from its shell.
sandboxed:
    arguments: ["--no-approve", "--no-skills"]

# How the agent is told what Porelo puts in its task - the mailbox where there is one, /porelo/files and
# what arrives there. Porelo writes this guide to a read-only file in every task Porelo makes and puts these
# arguments behind the 'sandboxed' ones, '{file}' standing for its path, on every start, attended or not, a resumed
# one included. 'pi --help' on 0.85.0: "--append-system-prompt <text>  Append text or file contents to the system prompt", so a
# path given there brings in the file's contents; 1.3.0's help reads the same, adding "(can be used multiple times)".
instructions:
    arguments: ["--append-system-prompt", "{file}"]

git_identity:
    name: Pi
    email: noreply@pi.dev

headless:
    # 'pi --print --mode json "<prompt>"'. The prompt is positional, so no flag names it - an empty
    # prompt flag is how a definition says that.
    prompt_flag: ""
    model_flag: "--model"
    output_format_flags: ["--print", "--mode", "json"]

session:
    supports_resume: true
    resume_flag: "--session"
    # Where it names the session it runs. Measured on 0.85.0, and on 1.3.0 by the VM suite's two session
    # scenarios: an unattended run's first record,
    # {"type":"session"}, carries the id, and '--session <id>' continues it. An attended session is kept as
    # /var/lib/pi/agent/sessions/--workspace--/<timestamp>_<id>.jsonl (Pi's directory, outside the home), whose name '--session' does not find - but
    # its first record is the same {"type":"session"}, and Porelo reads the id from inside the newest file.
    session_id:
        record: { type: session }
        key: id
        directory: "/var/lib/pi/agent/sessions/--workspace--"
        suffix: ".jsonl"
    # What the agent shows once it is at work, attended, having asked nothing - the acceptance kit
    # waits for it without typing. Measured at a terminal: on screen at the prompt, absent while
    # the trust question is up. The bound counts from the session
    # existing, after any image build: about four times the 31 s measured on the leg's machine kind,
    # amd64, on 2026-10-17.
    ready_marker: "Pi can explain its own features"
    ready_within_seconds: 120
    # When the agent is at rest at its prompt, for Porelo to type its one wake line into the session
    # and only then; never where 'waiting' matches. Read from the last 20 lines of the screen, plain. Measured
    # on the VM at a terminal: its footer ends its context line with "(auto)" at rest and at work, and while it works a line reads
    # "── <spinner> Working ───". "(auto)" also tells Pi's screen from the shell left when it exits. Pi has
    # no question box: a question it puts is plain text on a resting screen, so a wake there would read as an answer.
    at_rest:
        shows: ["(auto)"]
        # The ask dialog keeps the footer under it, so "(auto)" alone would let a wake line be typed
        # into the answer.
        lacks: ["Working ─", "Pi asks you"]
    # Pi has no tool to ask a person, and a question it writes as text ends its turn like any other:
    # nothing on its screen tells it from a turn that is done. So the ask extension this package installs
    # gives the model one, which asks through a dialog titled "Pi asks you". Measured on 1.5.0 at an
    # 80 by 24 terminal: the title stands alone on the ninth line from the bottom, under it the answer
    # line and the dialog's keys, then the footer with "(auto)"; once answered or cancelled the dialog
    # is gone. A question still written as text reads as not waiting, by the operator's decision of
    # 2026-11-11.
    waiting:
        screen:
            - contains: "Pi asks you"
              in_last_lines: 12
              for: "an answer to its question"
        # What a finished unattended run said last. Pi ends each message with a message_end record,
        # "the authoritative final message" in its docs/json.md, whose content is a list of parts -
        # thinking, text, tool calls - so the answer is the text parts of the last assistant message.
        last_message:
            record: { type: message_end, message.role: assistant }
            text: message.content
            part: { record: { type: text }, text: text }

provider:
    # OpenRouter's half - upstream, bearer header, the /api/v1 the OpenAI dialect is served under -
    # is declared once in providers/openrouter.yaml. Pointing this agent at a different provider is
    # now a choice at run time rather than an edit and a rebuild.
    default: openrouter

    # 'native' because Pi is not tied to one wire format: it knows providers, and speaks whichever
    # each one's own dialect is. An agent with a fixed format names it instead.
    dialect: native

    # A URL, not a socket: Pi registers a provider with a baseUrl and has nowhere to put a socket
    # path. Porelo answers that by binding a relay inside this task's own network namespace.
    endpoint: url

# The OAuth app 'porelo vault authorize github-copilot' grants, the one Pi signs in with without Porelo.
# Read in the shipped tree, @earendil-works/pi-ai's dist/auth/oauth/github-copilot.js: one client id on
# every host, kept base64-encoded, asking for read:user. BuiltTreeCheck holds the tree to this id.
login:
    # 'porelo vault authorize github-copilot' takes GitHub's device flow: a code confirmed on GitHub's page.
    flow: device-code
    grants:
        github-copilot:
            hosts:
                "*": Iv1.b507a08c87ecfe98
            owner: >-
                not named in Pi's source; widely cited as GitHub's own Copilot app for editors, which Pi
                presents itself as - not verified

# Pi's install ping and its update check go to pi.dev. Refused rather than merely absent, so a test can
# tell a policy from an oversight.
refused_domains:
    - pi.dev

install:
    version: "${agent.cli.version}"
    # Shipped in this package rather than fetched: Pi is 162 npm packages and a Node runtime, with
    # no single URL to pin. Verification happens once where the package is built, against a lockfile
    # that pins every dependency by integrity hash, and the image build then downloads nothing.
    #
    # Named beside the agent's binary rather than by absolute path, so an account that runs its own
    # copy of the agent copies its own tree into the image, not the machine's. The package puts it
    # there, in pi/ under the agents directory.
    packaged:
        - source: pi/pi-tree.tar.gz
          target: /opt
    as_root:
        - "# Pi runs from the tree copied in above. fd and rg come with it and go on PATH, where Pi looks"
        - "# before downloading them from GitHub, which a task cannot reach."
        - "# No version check and no telemetry: both ask pi.dev, which a task cannot reach. PI_TELEMETRY=0"
        - "# also drops the attribution headers Pi would add to provider requests."
        - "RUN ln -sf /opt/node/bin/node /usr/local/bin/node \\"
        - "    && printf '#!/bin/sh\\nexport PI_SKIP_VERSION_CHECK=1\\nexport PI_TELEMETRY=0\\nexport PI_CODING_AGENT_DIR=/var/lib/pi/agent\\nexec /opt/node/bin/node /opt/pi/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js \"$@\"\\n' > /usr/local/bin/pi \\"
        - "    && chmod 0755 /usr/local/bin/pi \\"
        - "    && ln -sf /opt/tools/bin/fd /usr/local/bin/fd \\"
        - "    && ln -sf /opt/tools/bin/rg /usr/local/bin/rg"
        - "# No sign-in can be stored in the task: an entry in auth.json wins over the broker, and /login cannot"
        - "# be switched off. Pi's directory is outside the home, where the agent could move even a root-owned one"
        - "# aside; sticky and root's, it takes the agent's sessions, settings and extensions, but not its stores."
        - "RUN mkdir -p /var/lib/pi/agent \\"
        - "    && chmod 0755 /var/lib/pi && chmod 1777 /var/lib/pi/agent \\"
        - "    && printf '{}' > /var/lib/pi/agent/auth.json && printf '{}' > /var/lib/pi/agent/mcp-auth.json \\"
        - "    && chmod 0444 /var/lib/pi/agent/auth.json /var/lib/pi/agent/mcp-auth.json"
