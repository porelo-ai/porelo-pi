# Builds against the PUBLISHED agent contract.
name: Build

# A push that only touches documentation builds nothing.
# Workflows alone build nothing: an action's move is checked by its pull request, and the next push with
# content builds with it.
on:
    push:
        branches: ['**']
        # A release: v<version>, built and published to the 'releases' channel. Paths are not filtered for a tag.
        tags: ['v*']
        paths-ignore: ['**/*.md', 'mkdocs.yml', 'doc/**', 'issues/**', '.github/**', 'porelo.yml']
    pull_request:
        branches: ['**']
        paths-ignore: ['**/*.md', 'mkdocs.yml', 'doc/**', 'issues/**', '.github/**', 'porelo.yml']
    workflow_dispatch:

# Read by every Maven call, the pinned-jdk action's too. On a tag -P!standard,!forge: no snapshot repository and
# nothing asked for again, so a release is built from releases only. Elsewhere -U: Maven asks for a newer snapshot
# once a day, and a cache restored the day Porelo publishes would keep yesterday's.
# The same file runs on GitHub and on the local Forgejo; what differs between them is only the values of variables
# and secrets present on both: the snapshot repository Maven reads (settings.xml), and whether this forge publishes.
env:
    MAVEN_ARGS: ${{ startsWith(github.ref, 'refs/tags/v') && '-P!standard,!forge' || '-U' }}
    MAVEN_SNAPSHOTS_URL: ${{ vars.MAVEN_SNAPSHOTS_URL }}

# Read-only: nothing in this workflow writes to the repository with its token.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    build:
        name: Build and unit tests
        # Pinned, not 'ubuntu-latest'.
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            # Every commit, so a pushed range is read from this checkout.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            # Publishing is switched by a variable present on both forges, true where the packages are published and
            # false where they are not; one missing or misspelt would leave them unpublished without a word.
            - name: Whether this forge publishes
              env:
                  PORELO_PUBLISH: ${{ vars.PORELO_PUBLISH }}
              run: |
                  case "$PORELO_PUBLISH" in
                      true | false) echo "PORELO_PUBLISH=$PORELO_PUBLISH" ;;
                      *) echo "::error::vars.PORELO_PUBLISH is '$PORELO_PUBLISH', neither true nor false"; exit 1 ;;
                  esac

            - name: The pinned GraalVM
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
              uses: ./.github/actions/pinned-jdk

            # Spotless checks every *.sh against shfmt in validate but does not download it, and a runner has
            # none. The version the parent pom pins, checked against the digest of its release, pinned here.
            - name: The pinned shfmt
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
              run: |
                  set -eu
                  VERSION="$(./mvnw -B -q -s settings.xml help:evaluate -Dexpression=shfmt.version -DforceStdout)"
                  [ "$VERSION" = 3.12.0 ] || { echo "::error::the pom pins shfmt '$VERSION'; this step installs 3.12.0"; exit 1; }
                  mkdir -p "$RUNNER_TEMP/bin"
                  curl -fsSL -o "$RUNNER_TEMP/bin/shfmt" \
                      "https://github.com/mvdan/sh/releases/download/v$VERSION/shfmt_v${VERSION}_linux_amd64"
                  echo "d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea  $RUNNER_TEMP/bin/shfmt" | sha256sum -c -
                  chmod +x "$RUNNER_TEMP/bin/shfmt"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Resolve the release tooling
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
              run: |
                  ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile=target/cp.txt

            # What every workflow step runs is pinned, and Dependabot moves the pins: the shared rule, refused
            # here when broken - a tag, a version-name JDK action, a pin without its exact release.
            - name: Every workflow step is pinned
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-actions

            # A leg asks for a machine by kind, so nothing here names the provider that lends it or its server types.
            - name: No provider named outside its implementation
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-providers .

            # -s settings.xml declares the snapshot repository the agent contract is resolved from, and keeps.
            - name: Build and unit tests
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
              run: ./mvnw -B -s settings.xml verify

            # A direct push to main never meets the pull request's check, so the push's own range is read here. A tag
            # checks the commit it names. A new branch or a branch pushed over has no start this checkout holds, so its
            # range starts at main; main itself cannot be pushed over.
            - name: The pushed commits' messages
              if: github.event_name == 'push'
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  set -eu
                  case "$PUSH_BEFORE" in
                      '') echo "::error::the push names no commit it started from"; exit 1 ;;
                  esac
                  start=$PUSH_BEFORE
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      start="$GITHUB_SHA~1"
                  elif ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                      if [ "$GITHUB_REF" = refs/heads/main ]; then
                          echo "::error::main moved from $PUSH_BEFORE, a commit this checkout does not hold"
                          exit 1
                      fi
                      start=origin/main
                  fi
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main \
                      check-commits "$start..$GITHUB_SHA"

            # The packages are what an operator installs, so a build that has not produced them has not proved.
            # Not -DskipTests: that also skips NativeLinkageCheck and PackageVersionCheck, the tests that
            # need the binary and the packages it is packed into.
            - name: Native binary and packages
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
              run: ./mvnw -B -s settings.xml -Pnative,dist verify
                  -Dagent.snapshot.run=${{ github.run_number }}

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages
                  path: |
                      target/*.deb
                      target/*.rpm
                      target/*.cdx.json
                  if-no-files-found: error

            # Publishing only from main, as a snapshot, and from a tag v<version>, as a release once every leg passed,
            # and only where PORELO_PUBLISH says so.
            - name: Not publishing
              if: "!(vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))"
              # The runner's own variables rather than expressions, so a branch's name never becomes shell.
              run: |
                  echo "Not publishing. This run is '$GITHUB_EVENT_NAME' on '$GITHUB_REF',"
                  echo "and only a push to main or a tag v<version> publishes, on a forge whose PORELO_PUBLISH is true."
                  echo "The packages were built and tested here"
                  echo "and are attached to this run as artifacts; nothing reached Artifactory, so"
                  echo "'apt' will still offer whatever was published last."

            # A tag publishes a release, everything else a snapshot. A release is refused unless the tag is exactly
            # 'v' plus the version it carries, and a version is never a release and a snapshot at once. Nor is a
            # release built against a Porelo snapshot, which is replaced under the same version.
            - name: Which channel
              id: channel
              if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  PORELO="$(sed -n 's|^        <porelo.version>\(.*\)</porelo.version>$|\1|p' pom.xml | head -1)"
                  [ -n "$PORELO" ] || { echo "::error::no porelo.version in pom.xml"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                          || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                      case "$VERSION" in
                          *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                      esac
                      case "$PORELO" in
                          *-SNAPSHOT) echo "::error::porelo.version $PORELO is a snapshot; a release is built against a released Porelo"; exit 1 ;;
                      esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                  else
                      case "$VERSION" in
                          *-SNAPSHOT) ;;
                          *) echo "::error::$VERSION on a branch would publish a release as a snapshot"; exit 1 ;;
                      esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                  fi
                  echo "  $VERSION -> $(tail -1 "$GITHUB_OUTPUT")"

            # A release depends only on releases: every -SNAPSHOT in the effective pom - dependencies, the imported
            # BOM, plugins and their dependencies such as porelo-release, inactive profiles too - refuses the tag.
            - name: A release depends only on releases
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              run: |
                  ./mvnw -B -s settings.xml help:effective-pom -Doutput=target/effective-pom.xml
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-releases target/effective-pom.xml \
                      --requires org.fuin.porelo:porelo-release

            # The same two repositories Porelo itself publishes to.
            - name: Publish the packages
              if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eux
                  . .github/scripts/artifactory.sh
                  art_login
                  # A published release is never replaced, as on Central. A question that gets no answer
                  # stops here: read as "not published", it would replace the release.
                  if [ "$CHANNEL" = releases ]; then
                      DEB="$(basename target/*.deb)"
                      RPM="$(basename target/*.rpm)"
                      curl -sfL -o target/published-index "${JF_URL}/artifactory/porelo-dist-deb/dists/releases/main/binary-amd64/Packages" \
                          || { echo "::error::the Debian index could not be read, so whether $DEB is published is unknown"; exit 1; }
                      if grep -qF "Filename: pool/main/p/porelo-agent-pi/$DEB" target/published-index; then
                          echo "::error::this release is published already: $DEB"; exit 1
                      fi
                      CODE="$(curl -sL -o /dev/null -w '%{http_code}' "${JF_URL}/artifactory/api/storage/porelo-dist-rpm/releases/$RPM")" \
                          || { echo "::error::Artifactory could not be asked whether $RPM is published"; exit 1; }
                      case "$CODE" in
                          404) ;;
                          200) echo "::error::this release is published already: $RPM"; exit 1 ;;
                          *) echo "::error::asked whether $RPM is published, Artifactory answered HTTP $CODE"; exit 1 ;;
                      esac
                  fi
                  for p in target/*.deb; do
                      art_put "$p" "porelo-dist-deb/pool/main/p/porelo-agent-pi/" \
                          "deb.distribution=${CHANNEL};deb.component=main;deb.architecture=amd64"
                  done
                  for p in target/*.rpm; do art_put "$p" "porelo-dist-rpm/${CHANNEL}/"; done

                  # The bill beside the package, readable without installing.
                  art_put "target/porelo-agent-pi.cdx.json" "porelo-dist-deb/pool/main/p/porelo-agent-pi/"
                  art_put "target/porelo-agent-pi.cdx.json" "porelo-dist-rpm/${CHANNEL}/"

            # Uploaded is not installable.
            - name: The package is indexed, not merely stored
              if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eu
                  # The version this run built, not merely the name: after the first publish the name is
                  # always in the index.
                  VERSION="$(dpkg-deb -f target/*.deb Version)"
                  tries=0
                  # -L: Artifactory answers a file with a redirect to its cloud storage, and without it the
                  # body is empty - every package then reads as "not indexed" although it is.
                  while [ "$tries" -lt 20 ]; do
                      if curl -sfL "${JF_URL}/artifactory/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages" \
                          | awk -v version="$VERSION" '
                              /^$/ { pi = 0 }
                              /^Package: / { pi = ($2 == "porelo-agent-pi") }
                              /^Version: / && pi && $2 == version { found = 1 }
                              END { exit !found }'; then
                          echo "  OK    the Debian index lists porelo-agent-pi $VERSION"
                          exit 0
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
                  echo "::error::porelo-agent-pi $VERSION never appeared in the index - uploaded but not indexed"
                  exit 1

    # The last step, and the only one that installs what an operator installs.
    # A Build on main whose tree a run of this repository already proved within a day - both legs of a Build,
    # or the update job that verified it - takes those legs instead of renting again. A tag always runs its own.
    # It asks GitHub's API, so it runs only where PORELO_PUBLISH is true, which is GitHub.
    proof:
        name: Legs already proven
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Reads this repository's runs, jobs and artifact names; nothing more.
        permissions:
            contents: read
            actions: read
        outputs:
            proven: ${{ steps.ask.outputs.proven }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: The pinned GraalVM
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
              uses: ./.github/actions/pinned-jdk

            - name: Resolve the release tooling
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
              run: |
                  ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile=target/cp.txt

            # It never fails the job: not knowing means the legs run.
            - name: Ask for a run that proved this tree
              id: ask
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main proven-legs \
                      --repository "$GITHUB_REPOSITORY" --tree "$(git rev-parse 'HEAD^{tree}')" \
                      --jobs "Acceptance - ubuntu,Acceptance - fedora;Follow upstream"

    acceptance:
        name: Acceptance - ${{ matrix.os }}
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        needs: [build, proof]
        # The proof is skipped on a tag and a dispatch, and a failed one proves nothing: the legs run then.
        # Only on GitHub while the repository moves: the host's pool lends no forge job a machine by kind yet.
        if: >-
            !cancelled() && needs.build.result == 'success' && needs.proof.outputs.proven != 'yes'
            && github.server_url == 'https://github.com'
            && (github.event_name == 'workflow_dispatch'
            || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))

        strategy:
            fail-fast: false
            # One at a time.
            max-parallel: 1
            matrix:
                os: [ubuntu, fedora]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # A release is published only after these legs, so on a tag they install what this run built; so does a
            # forge that publishes nothing, where the repository holds what another forge published before.
            - name: The packages this run built
              if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || vars.PORELO_PUBLISH != 'true'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: packages
                  path: candidate

            # For the Cucumber half, which runs on this runner against the rented machine and needs the JDK.
            - name: The pinned GraalVM
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
              uses: ./.github/actions/pinned-jdk

            # Spotless checks every *.sh against shfmt in validate but does not download it, and a runner has
            # none. The version the parent pom pins, checked against the digest of its release, pinned here.
            - name: The pinned shfmt
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
              run: |
                  set -eu
                  VERSION="$(./mvnw -B -q -s settings.xml help:evaluate -Dexpression=shfmt.version -DforceStdout)"
                  [ "$VERSION" = 3.12.0 ] || { echo "::error::the pom pins shfmt '$VERSION'; this step installs 3.12.0"; exit 1; }
                  mkdir -p "$RUNNER_TEMP/bin"
                  curl -fsSL -o "$RUNNER_TEMP/bin/shfmt" \
                      "https://github.com/mvdan/sh/releases/download/v$VERSION/shfmt_v${VERSION}_linux_amd64"
                  echo "d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea  $RUNNER_TEMP/bin/shfmt" | sha256sum -c -
                  chmod +x "$RUNNER_TEMP/bin/shfmt"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            # Before anything is created, so the cleanup below always has something to run.
            - name: Resolve the machine tooling
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
              run: |
                  ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile=target/cp.txt

            # PORELO_E2E_OPENROUTER_API_KEY turns the tier 2 half on, so an empty one fails the leg rather than thinning it.
            - name: Acceptance on ${{ matrix.os }}
              timeout-minutes: 30
              env:
                  PORELO_PUBLISHER_TOKEN: ${{ secrets.PORELO_PUBLISHER_TOKEN }}
                  PORELO_MACHINES_API: ${{ secrets.PORELO_MACHINES_API }}
                  PORELO_MACHINES_SSH: ${{ secrets.PORELO_MACHINES_SSH }}
                  PORELO_PUBLISH: ${{ vars.PORELO_PUBLISH }}
                  PORELO_CI_LEG: acc-${{ matrix.os }}
                  OS: ${{ matrix.os }}
                  PORELO_E2E_OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
                  # Here rather than a repository setting, so the model is visible and changes with a commit.
                  PORELO_E2E_MODEL: z-ai/glm-5.3-flash
              # '--cucumber' adds the suite in src/acceptance, run from this runner as a person at a terminal,.
              run: |
                  [ -n "${PORELO_E2E_OPENROUTER_API_KEY:-}" ] || { echo "::error::the secret OPEN_ROUTER_API_KEY is empty - the credential scenarios would be skipped and the leg would prove less"; exit 1; }
                  # The version scenario asks the installed CLI for the pin; unset, it is skipped and a package
                  # installing another version passes.
                  PORELO_E2E_EXPECT_CLI="$(sed -n 's:.*<agent.cli.version>\(.*\)</agent.cli.version>.*:\1:p' pom.xml | head -n 1)"
                  [ -n "$PORELO_E2E_EXPECT_CLI" ] || { echo "::error::pom.xml names no agent.cli.version"; exit 1; }
                  export PORELO_E2E_EXPECT_CLI
                  if [ "$GITHUB_REF_TYPE" = tag ] || [ "$PORELO_PUBLISH" != true ]; then FROM="--package porelo-agent-pi --candidate candidate"; else FROM="--package porelo-agent-pi"; fi
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main acceptance \
                      --os "$OS" --kind amd64 $FROM \
                      --cucumber .

            - name: Delete what this run created
              if: always()
              env:
                  PORELO_MACHINES_API: ${{ secrets.PORELO_MACHINES_API }}
                  PORELO_CI_LEG: acc-${{ matrix.os }}
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main sweep --mine

    # A release is never replaced and is what people install, so it waits for every job of the run, the legs
    # on rented machines included. A snapshot publishes from the build job, beside a leg still running.
    release:
        name: Publish the release
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: [build, acceptance]
        if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # A tag publishes a release, everything else a snapshot. A release is refused unless the tag is exactly
            # 'v' plus the version it carries, and a version is never a release and a snapshot at once. Nor is a
            # release built against a Porelo snapshot, which is replaced under the same version.
            - name: Which channel
              id: channel
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  PORELO="$(sed -n 's|^        <porelo.version>\(.*\)</porelo.version>$|\1|p' pom.xml | head -1)"
                  [ -n "$PORELO" ] || { echo "::error::no porelo.version in pom.xml"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                          || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                      case "$VERSION" in
                          *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                      esac
                      case "$PORELO" in
                          *-SNAPSHOT) echo "::error::porelo.version $PORELO is a snapshot; a release is built against a released Porelo"; exit 1 ;;
                      esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                  else
                      case "$VERSION" in
                          *-SNAPSHOT) ;;
                          *) echo "::error::$VERSION on a branch would publish a release as a snapshot"; exit 1 ;;
                      esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                  fi
                  echo "  $VERSION -> $(tail -1 "$GITHUB_OUTPUT")"

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: packages
                  path: target

            # The same two repositories Porelo itself publishes to.
            - name: Publish the packages
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eux
                  . .github/scripts/artifactory.sh
                  art_login
                  # A published release is never replaced, as on Central. A question that gets no answer
                  # stops here: read as "not published", it would replace the release.
                  if [ "$CHANNEL" = releases ]; then
                      DEB="$(basename target/*.deb)"
                      RPM="$(basename target/*.rpm)"
                      curl -sfL -o target/published-index "${JF_URL}/artifactory/porelo-dist-deb/dists/releases/main/binary-amd64/Packages" \
                          || { echo "::error::the Debian index could not be read, so whether $DEB is published is unknown"; exit 1; }
                      if grep -qF "Filename: pool/main/p/porelo-agent-pi/$DEB" target/published-index; then
                          echo "::error::this release is published already: $DEB"; exit 1
                      fi
                      CODE="$(curl -sL -o /dev/null -w '%{http_code}' "${JF_URL}/artifactory/api/storage/porelo-dist-rpm/releases/$RPM")" \
                          || { echo "::error::Artifactory could not be asked whether $RPM is published"; exit 1; }
                      case "$CODE" in
                          404) ;;
                          200) echo "::error::this release is published already: $RPM"; exit 1 ;;
                          *) echo "::error::asked whether $RPM is published, Artifactory answered HTTP $CODE"; exit 1 ;;
                      esac
                  fi
                  for p in target/*.deb; do
                      art_put "$p" "porelo-dist-deb/pool/main/p/porelo-agent-pi/" \
                          "deb.distribution=${CHANNEL};deb.component=main;deb.architecture=amd64"
                  done
                  for p in target/*.rpm; do art_put "$p" "porelo-dist-rpm/${CHANNEL}/"; done

                  # The bill beside the package, readable without installing.
                  art_put "target/porelo-agent-pi.cdx.json" "porelo-dist-deb/pool/main/p/porelo-agent-pi/"
                  art_put "target/porelo-agent-pi.cdx.json" "porelo-dist-rpm/${CHANNEL}/"

            # Uploaded is not installable.
            - name: The package is indexed, not merely stored
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eu
                  # The version this run built, not merely the name: after the first publish the name is
                  # always in the index.
                  VERSION="$(dpkg-deb -f target/*.deb Version)"
                  tries=0
                  # -L: Artifactory answers a file with a redirect to its cloud storage, and without it the
                  # body is empty - every package then reads as "not indexed" although it is.
                  while [ "$tries" -lt 20 ]; do
                      if curl -sfL "${JF_URL}/artifactory/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages" \
                          | awk -v version="$VERSION" '
                              /^$/ { pi = 0 }
                              /^Package: / { pi = ($2 == "porelo-agent-pi") }
                              /^Version: / && pi && $2 == version { found = 1 }
                              END { exit !found }'; then
                          echo "  OK    the Debian index lists porelo-agent-pi $VERSION"
                          exit 0
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
                  echo "::error::porelo-agent-pi $VERSION never appeared in the index - uploaded but not indexed"
                  exit 1
