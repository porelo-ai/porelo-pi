# The marked rule blocks in AGENTS.md are shared copies; a hash that no longer fits its text means one
# was edited alone. Beside it the shared document checks: citations of issues in any page or source, and
# the documentation chapter, and the tests tagged documents. A job of its own, so it checks them without
# leasing machines.
name: Shared rules check

# Once a day, not on a push: every hand-over runs the same checks locally on its exact commit first, and a run per
# push spent build minutes on what was already known. 03:17 UTC lies outside the hours the repositories are worked in.
on:
    schedule:
        - cron: '17 3 * * *'
    pull_request:
    workflow_dispatch:

# Read by every Maven call, the pinned-jdk action's too: Maven asks for a newer snapshot once a day, and a
# cache restored the day Porelo publishes would keep yesterday's. Never run on a tag. As in the Build workflow:
# the snapshot repository Maven reads, a variable present on GitHub and the local Forgejo.
env:
    MAVEN_ARGS: -U
    MAVEN_SNAPSHOTS_URL: ${{ vars.MAVEN_SNAPSHOTS_URL }}

# Read-only: nothing in this workflow writes to the repository with its token.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    check-shared:
        name: Every shared rules block is unchanged
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            # Every commit, so the scheduled run reads main's last day without a second fetch.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: The pinned GraalVM
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              uses: ./.github/actions/pinned-jdk

            # Spotless checks every *.sh against shfmt in validate but does not download it, and a runner has
            # none. The version the parent pom pins, checked against the digest of its release, pinned here.
            - name: The pinned shfmt
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  set -eu
                  VERSION="$(./mvnw -B -q -s settings.xml help:evaluate -Dexpression=shfmt.version -DforceStdout)"
                  [ "$VERSION" = 3.12.0 ] || { echo "::error::the pom pins shfmt '$VERSION'; this step installs 3.12.0"; exit 1; }
                  mkdir -p "$RUNNER_TEMP/bin"
                  curl -fsSL -o "$RUNNER_TEMP/bin/shfmt" \
                      "https://github.com/mvdan/sh/releases/download/v$VERSION/shfmt_v${VERSION}_linux_amd64"
                  echo "d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea  $RUNNER_TEMP/bin/shfmt" | sha256sum -c -
                  chmod +x "$RUNNER_TEMP/bin/shfmt"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Resolve the release tooling
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile=target/cp.txt

            - name: Every shared rules block is unchanged
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-shared AGENTS.md .editorconfig

            - name: No issue is cited by its file or by a number that is gone
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-citations .

            - name: Every page of the documentation chapter is in its navigation once
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-doc-site doc mkdocs.yml

            - name: Every module directory has a README that links its submodules
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-readmes .

            - name: The tests that read a document
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: ./mvnw -B -s settings.xml -Pdocuments test

            # A pull request's own commits held to the shared rule on commit messages. One from outside - from another
            # repository, or opened by someone not a member - also carries its author's Signed-off-by: on each commit,
            # the Developer Certificate of Origin; Dependabot's and GitHub's own commits are exempt by the author and
            # committer they record. The repository's own workflow opens its pull requests from a branch only a holder
            # of write access can push, so those are from inside, though GitHub names their author a contributor. The
            # host's forge names no author association at all; there too only write access pushes a branch of the same
            # repository, and only the person's approval merges it, so such a pull request is from inside.
            - name: The pull request's commit messages
              if: github.event_name == 'pull_request'
              env:
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  PR_SERVER: ${{ github.server_url }}
              run: |
                  set -eu
                  # The checkout holds every commit, both sides of the merge among them, so nothing is fetched again.
                  outside=--outside
                  if [ "$PR_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
                      case "$PR_ASSOCIATION" in OWNER | MEMBER) outside= ;; esac
                      if [ "$PR_AUTHOR" = 'github-actions[bot]' ]; then
                          outside=
                      fi
                      if [ "$PR_SERVER" != 'https://github.com' ]; then
                          outside=
                      fi
                  fi
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main \
                      check-commits "$PR_BASE..$PR_HEAD" $outside

            # A push the Build never starts, of [skip ci] commits or of documents alone, meets no check of its own, so
            # each day main's commits of the last 26 hours are read, with two hours over the schedule's own day.
            - name: Main's commits of the last day
              if: github.event_name == 'schedule'
              run: |
                  set -eu
                  # A repository younger than that is read whole, its first commit too.
                  start=$(git rev-list -1 --before='26 hours ago' HEAD)
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main \
                      check-commits "${start:+$start..}HEAD"
