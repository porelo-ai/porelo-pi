# The marked rule blocks in AGENTS.md are shared copies; a hash that no longer fits its text means one
# was edited alone. Beside it the shared document checks: citations of issues in any page or source, and
# the documentation chapter, and the tests tagged documents. A job of its own, so it checks them without
# leasing machines.
name: Shared rules check
run-name: "${{ github.workflow }} · ${{ github.ref_name }}: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}"

# Once a day, not on a push: every hand-over runs the same checks locally on its exact commit first, and a run per
# push spent build minutes on what was already known. 03:17 UTC lies outside the hours the repositories are worked in.
on:
    schedule:
        - cron: '17 3 * * *'
    pull_request:
    workflow_dispatch:

# Read by every Maven call, the pinned-jdk action's too: Maven asks for a newer snapshot once a day, and a
# cache restored the day Porelo publishes would keep yesterday's. Never run on a tag.
env:
    MAVEN_ARGS: -U

# Read-only: nothing in this workflow writes to the repository with its token.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    check-shared:
        name: Every shared rules block is unchanged
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            # Spotless checks every *.sh against shfmt in validate but does not download it, and a runner has
            # none. The version the parent pom pins, checked against the digest of its release, pinned here.
            - name: The pinned shfmt
              run: |
                  set -eu
                  VERSION="$(./mvnw -B -q -s settings.xml help:evaluate -Dexpression=shfmt.version -DforceStdout)"
                  [ "$VERSION" = 3.12.0 ] || { echo "::error::the pom pins shfmt '$VERSION'; this step installs 3.12.0"; exit 1; }
                  mkdir -p "$RUNNER_TEMP/bin"
                  curl -fsSL -o "$RUNNER_TEMP/bin/shfmt" \
                      "https://github.com/mvdan/sh/releases/download/v$VERSION/shfmt_v${VERSION}_linux_amd64"
                  echo "d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea  $RUNNER_TEMP/bin/shfmt" | sha256sum -c -
                  chmod +x "$RUNNER_TEMP/bin/shfmt"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Resolve the release tooling
              run: |
                  ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile=target/cp.txt

            - name: Every shared rules block is unchanged
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-shared AGENTS.md .editorconfig

            - name: No issue is cited by its file or by a number that is gone
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-citations .

            - name: Every page of the documentation chapter is in its navigation once
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-doc-site doc mkdocs.yml

            - name: Every module directory has a README that links its submodules
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-readmes .

            - name: The tests that read a document
              run: ./mvnw -B -s settings.xml -Pdocuments test
