# Follows Pi and the tree's pins - Node, fd, ripgrep - so nobody has to. One run asks about all of them,
# moves each one with a release old enough as a commit of its own, verifies them together once, and
# opens one pull request. A person who wants one of them out drops its commit.
name: Agent version update

on:
    schedule:
        # Weekly, Tuesday 05:17 UTC: each agent repository has a weekday of its own.
        - cron: '17 5 * * 2'
    workflow_dispatch:
        inputs:
            what:
                description: 'What to follow: all of them, or the CLI or one pin'
                type: choice
                options: [all, node, fd, rg, cli]
                default: all
            version:
                description: 'Take this exact version instead of asking upstream - with one of them chosen above'
                required: false
            channel:
                description: "Which npm dist-tag to follow for the CLI when no version is given"
                required: false
                default: latest

# Read by every Maven call, the pinned-jdk action's too: Maven asks for a newer snapshot once a day, and a
# cache restored the day Porelo publishes would keep yesterday's. Never run on a tag. As in the Build workflow:
# the snapshot repository Maven reads, a variable present on GitHub and the local Forgejo.
env:
    MAVEN_SNAPSHOTS_URL: ${{ vars.MAVEN_SNAPSHOTS_URL }}
    MAVEN_ARGS: -U

# Read-only for the workflow; the job below takes the two it needs to write, and no more.
permissions:
    contents: read

# Never two at once.
concurrency:
    group: update
    cancel-in-progress: false

jobs:

    update:
        name: Follow upstream
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        # It updates the central forge only - its pull request, its merge and the bill it compares with are
        # GitHub's and Artifactory's - so it runs only where PORELO_PUBLISH is true.
        if: vars.PORELO_PUBLISH == 'true'
        # Pushes the pin's branch and opens its pull request: these two, for this job only.
        permissions:
            contents: write
            pull-requests: write

        steps:

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Before the lookup, which is Porelo's release tool; and before anything is rented, so the
            # cleanup below always has something to run.
            - name: The pinned GraalVM
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              uses: ./.github/actions/pinned-jdk

            # Spotless checks every *.sh against shfmt in validate but does not download it, and a runner has
            # none. The version the parent pom pins, checked against the digest of its release, pinned here.
            - name: The pinned shfmt
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  set -eu
                  VERSION="$(./mvnw -B -q -s settings.xml help:evaluate -Dexpression=shfmt.version -DforceStdout)"
                  [ "$VERSION" = 3.12.0 ] || { echo "::error::the pom pins shfmt '$VERSION'; this step installs 3.12.0"; exit 1; }
                  mkdir -p "$RUNNER_TEMP/bin"
                  curl -fsSL -o "$RUNNER_TEMP/bin/shfmt" \
                      "https://github.com/mvdan/sh/releases/download/v$VERSION/shfmt_v${VERSION}_linux_amd64"
                  echo "d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea  $RUNNER_TEMP/bin/shfmt" | sha256sum -c -
                  chmod +x "$RUNNER_TEMP/bin/shfmt"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Resolve the release and machine tooling
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile=target/cp.txt
                  git config user.name 'porelo-update'
                  git config user.email 'noreply@fuin.org'

            # ------------------------------------------------------------------ detect and apply

            # Through env, never interpolated into the script, so no value can become shell. The pom holds
            # each pin's upstream and line, and the age a release must reach before it is taken; the script
            # refuses a version typed by hand for all of them at once.
            - name: What upstream publishes, and what moves
              id: follow
              env:
                  WHAT: ${{ inputs.what || 'all' }}
                  VERSION: ${{ inputs.version }}
                  CHANNEL: ${{ inputs.channel || 'latest' }}
              run: buildtools/follow-upstream.sh

            # ------------------------------------------------------------------ verify

            # Gates write STOP rather than failing, so the run can still clean up after itself.
            - name: Unit tests
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              if: steps.follow.outputs.moved == 'yes'
              run: |
                  ./mvnw -B -s settings.xml verify || echo "STOP=the unit suite failed" >> "$GITHUB_ENV"

            # Not -DskipTests: it would skip the checks that need the binary and the built tree, which are
            # what a new version most needs asked.
            - name: Native binary and packages
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              if: steps.follow.outputs.moved == 'yes' && !env.STOP
              run: |
                  ./mvnw -B -s settings.xml -Pnative,dist verify \
                      -Dagent.snapshot.run=${{ github.run_number }} \
                      || echo "STOP=the packages did not build" >> "$GITHUB_ENV"

            # What moved carries its version in its purl, so without --expect-moved this stops every time.
            # Nothing else is excused, which is the point.
            - name: What else changed in the shipped tree
              if: steps.follow.outputs.moved == 'yes' && !env.STOP
              env:
                  COMPONENTS: ${{ steps.follow.outputs.components }}
              run: |
                  set --
                  for component in $COMPONENTS; do
                      set -- "$@" --expect-moved "$component"
                  done
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main compare-bills \
                      target/porelo-agent-pi.cdx.json \
                      https://fuinorg.jfrog.io/artifactory/porelo-dist-deb/pool/main/p/porelo-agent-pi/porelo-agent-pi.cdx.json \
                      "$@" \
                      > target/bill-change.txt 2>&1 \
                      || echo "STOP=third-party components or licenses changed" >> "$GITHUB_ENV"
                  # In a file as well, so the pull request can carry it rather than only the run log.
                  cat target/bill-change.txt

            # A major version, a pin older than upstream says, or an upstream that could not be asked: the
            # rest still verified above, but nothing machines would add changes who has to decide.
            - name: What upstream said that a person decides
              if: steps.follow.outputs.stop != ''
              env:
                  UPSTREAM_STOP: ${{ steps.follow.outputs.stop }}
              run: |
                  echo "::warning::$UPSTREAM_STOP"
                  if [ -z "${STOP:-}" ]; then
                      echo "STOP=$UPSTREAM_STOP" >> "$GITHUB_ENV"
                  fi

            # Without it the credential scenarios skip and the legs below pass on less than they claim.
            # The tree these legs verify, named by an artifact only this run can make, so the Build of the same
            # tree on main takes these legs (porelo-release proven-legs) instead of renting them again.
            - name: Name the tree this run verifies
              id: tree
              if: steps.follow.outputs.moved == 'yes' && !env.STOP
              run: |
                  set -eu
                  # Every move is committed by now, and the request pushes this commit.
                  TREE="$(git rev-parse 'HEAD^{tree}')"
                  echo "$TREE" > "$RUNNER_TEMP/verified-tree"
                  echo "tree=$TREE" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: steps.tree.outputs.tree
              with:
                  name: porelo-verified-tree-${{ steps.tree.outputs.tree }}
                  path: ${{ runner.temp }}/verified-tree
                  retention-days: 2

            - name: The provider key is there
              if: steps.follow.outputs.moved == 'yes' && !env.STOP
              env:
                  KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
              run: |
                  [ -n "$KEY" ] || echo "STOP=the secret OPEN_ROUTER_API_KEY is empty, so the credential scenarios would be skipped" >> "$GITHUB_ENV"

            - name: Acceptance - ubuntu
              timeout-minutes: 30
              if: steps.follow.outputs.moved == 'yes' && !env.STOP
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
                  PORELO_MACHINES_API: ${{ secrets.PORELO_MACHINES_API }}
                  PORELO_MACHINES_SSH: ${{ secrets.PORELO_MACHINES_SSH }}
                  PORELO_CI_LEG: upd-ubuntu
                  PORELO_E2E_OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
                  PORELO_E2E_MODEL: z-ai/glm-5.3-flash
                  # Only when the CLI moved; otherwise the package installs the CLI that is already pinned.
                  PORELO_E2E_EXPECT_CLI: ${{ steps.follow.outputs.cli }}
              run: |
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main acceptance \
                      --os ubuntu --kind amd64 --package porelo-agent-pi \
                      --cucumber . --candidate target \
                      || echo "STOP=acceptance failed on ubuntu" >> "$GITHUB_ENV"

            - name: Acceptance - fedora
              timeout-minutes: 30
              if: steps.follow.outputs.moved == 'yes' && !env.STOP
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
                  PORELO_MACHINES_API: ${{ secrets.PORELO_MACHINES_API }}
                  PORELO_MACHINES_SSH: ${{ secrets.PORELO_MACHINES_SSH }}
                  PORELO_CI_LEG: upd-fedora
                  PORELO_E2E_OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
                  PORELO_E2E_MODEL: z-ai/glm-5.3-flash
                  PORELO_E2E_EXPECT_CLI: ${{ steps.follow.outputs.cli }}
              run: |
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main acceptance \
                      --os fedora --kind amd64 --package porelo-agent-pi \
                      --cucumber . --candidate target \
                      || echo "STOP=acceptance failed on fedora" >> "$GITHUB_ENV"

            - name: Delete what this run created
              if: always() && steps.follow.outputs.moved == 'yes'
              env:
                  PORELO_MACHINES_API: ${{ secrets.PORELO_MACHINES_API }}
                  PORELO_CI_LEG: upd-ubuntu
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main sweep --mine

            - name: Delete what this run created - fedora leg
              if: always() && steps.follow.outputs.moved == 'yes'
              env:
                  PORELO_MACHINES_API: ${{ secrets.PORELO_MACHINES_API }}
                  PORELO_CI_LEG: upd-fedora
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main sweep --mine

            # ------------------------------------------------------------------ ask, or publish

            # One branch for every run: an update that is still open when the next week's run moves more is
            # replaced by the newer one, rather than a second request conflicting with the first.
            - name: Open the pull request
              id: request
              if: always() && steps.follow.outputs.moved == 'yes'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TITLE: ${{ steps.follow.outputs.title }}
                  RUN_NUMBER: ${{ github.run_number }}
                  JOB_STATUS: ${{ job.status }}
              run: |
                  set -eu
                  # A step killed by its limit or cancelled writes no STOP; only the job's status says so.
                  if [ "$JOB_STATUS" != success ] && [ -z "${STOP:-}" ]; then
                      STOP="a step before this one ended as $JOB_STATUS"
                  fi
                  BRANCH=update/pi
                  git checkout -B "$BRANCH"
                  # A branch moves only from its own main: one left by a closed request, or under an open one made
                  # on an older main, holds that main's workflows, and moving it would move them, which this job's
                  # token may never do. Such a branch is deleted first; its open request is closed and named by the
                  # fresh one.
                  OPEN="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
                  REPLACES=""
                  if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
                      BEHIND=""
                      if [ -n "$OPEN" ]; then
                          BEHIND="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$BRANCH" --jq .behind_by)"
                      fi
                      if [ "$BEHIND" != 0 ]; then
                          if [ -n "$OPEN" ]; then
                              gh pr close "$OPEN" --comment "Made on an older main; run $GITHUB_RUN_NUMBER opens a fresh request."
                              REPLACES="$OPEN"
                              OPEN=""
                          fi
                          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null
                      fi
                  fi
                  # The checkout keeps no token, so this push alone gets it: through git's environment, for
                  # this step only, never on a command line or in $GITHUB_ENV.
                  BASIC="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
                  echo "::add-mask::$BASIC"
                  export GIT_CONFIG_COUNT=1
                  export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
                  GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $BASIC"
                  export GIT_CONFIG_VALUE_0
                  git push --force origin "$BRANCH"

                  {
                    echo "Applied by Porelo's release tool, one commit per move. To leave one out, drop its"
                    echo "commit and let the build run again."
                    echo
                    cat target/update/summary.md
                    echo
                    if [ -n "${STOP:-}" ]; then
                        echo "**This is not ready to publish: $STOP.**"
                        echo "Automation is not allowed to decide this one - see the run log."
                        if [ -s target/bill-change.txt ]; then
                            echo
                            echo "<details><summary>What changed in the shipped tree</summary>"
                            echo
                            echo '```'
                            cat target/bill-change.txt
                            echo '```'
                            echo
                            echo "</details>"
                        fi
                    else
                        echo "**Green.** Unit suite, the pin check against the published manifest, both"
                        echo "packages, an unchanged third-party component set apart from what moved, and the"
                        echo "acceptance suites on Ubuntu and Fedora against these packages rather than the"
                        echo "published ones."
                    fi
                  } > "$RUNNER_TEMP/body.md"
                  if [ -n "$REPLACES" ]; then
                      printf '\nReplaces #%s, made on an older `main`.\n' "$REPLACES" >> "$RUNNER_TEMP/body.md"
                  fi
                  if [ -n "$OPEN" ]; then
                      gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
                      gh pr comment "$BRANCH" --body "Replaced by run $RUN_NUMBER: $TITLE."
                      echo "the open update request now holds what this run moved"
                  else
                      gh pr create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" --head "$BRANCH" --base main
                  fi
                  echo "opened=yes" >> "$GITHUB_OUTPUT"

            # Auto-merge needs its own token: the default one does not trigger a further workflow.
            - name: Merge, or say why not
              if: always() && steps.request.outputs.opened == 'yes'
              env:
                  GH_TOKEN: ${{ secrets.PORELO_UPDATE_TOKEN || github.token }}
                  AUTO: ${{ vars.PORELO_UPDATE_AUTO_MERGE }}
                  HAVE_TOKEN: ${{ secrets.PORELO_UPDATE_TOKEN != '' }}
                  TITLE: ${{ steps.follow.outputs.title }}
                  JOB_STATUS: ${{ job.status }}
              run: |
                  set -eu
                  # A step killed by its limit or cancelled writes no STOP; only the job's status says so.
                  if [ "$JOB_STATUS" != success ] && [ -z "${STOP:-}" ]; then
                      STOP="a step before this one ended as $JOB_STATUS"
                  fi
                  if [ -n "${STOP:-}" ]; then
                      echo "Not merging: $STOP."
                      echo "The branch is open for whoever decides it."
                  elif [ "$AUTO" != "true" ]; then
                      echo "Not merging: the repository variable PORELO_UPDATE_AUTO_MERGE is '${AUTO:-unset}'."
                      echo "Everything passed. Merging the pull request publishes: $TITLE."
                      echo "Set the variable to 'true' when these runs have been watched enough."
                  elif [ "$HAVE_TOKEN" != "true" ]; then
                      echo "::error::PORELO_UPDATE_AUTO_MERGE is on but the secret PORELO_UPDATE_TOKEN is not set."
                      echo "Merging with the workflow's own token triggers no build, so nothing would be"
                      echo "published and the run would look successful. Refusing to merge."
                      exit 1
                  else
                      # A merge commit, not a squash: each move stays a commit of its own on main.
                      gh pr merge --merge --delete-branch update/pi
                      echo "Merged. The push to main builds and publishes: $TITLE."
                  fi

            # Red means there is something to look at, and only that - including an upstream stop when
            # nothing moved and there is no pull request to carry it.
            - name: Stop
              if: always() && (env.STOP || steps.follow.outputs.stop != '')
              env:
                  UPSTREAM_STOP: ${{ steps.follow.outputs.stop }}
              run: |
                  echo "::error::${STOP:-$UPSTREAM_STOP}"
                  exit 1
